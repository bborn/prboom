name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build every target
        run: |
          set -eu
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            stage="dist/prboom-$os-$arch"
            mkdir -p "$stage/bin" "$stage/skills"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "$stage/bin/prboom" .
            cp bin/* "$stage/bin/"
            cp -R skills/* "$stage/skills/"
            cp README.md LICENSE "$stage/" 2>/dev/null || cp README.md "$stage/"
            tar -C dist -czf "dist/prboom-$os-$arch.tar.gz" "prboom-$os-$arch"
          done
          cd dist && shasum -a 256 *.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
